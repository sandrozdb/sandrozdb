<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Sandro Ferreira</title>
  <desc id="desc">Consultoria, inteligência artificial, dados e automação</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021814"/>
      <stop offset="0.55" stop-color="#03231D"/>
      <stop offset="1" stop-color="#0A2216"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11CDB7"/>
      <stop offset="0.34" stop-color="#4E7BFF"/>
      <stop offset="0.68" stop-color="#9B46E6"/>
      <stop offset="1" stop-color="#F04B44"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10CDB5"/>
      <stop offset="0.45" stop-color="#FFD400"/>
      <stop offset="0.72" stop-color="#F04B44"/>
      <stop offset="1" stop-color="#9B46E6"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#18A890" stroke-width="1" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="440" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="30" fill="url(#grid)"/>
  <circle cx="1325" cy="80" r="170" fill="#FFD400" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1190" cy="360" r="220" fill="#00CDB4" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(92 62)">
    <rect x="0" y="0" width="58" height="6" rx="3" fill="#FFD400"/>
    <text x="0" y="42" fill="#17D8C1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">CONSULTORIA • IA • DADOS • AUTOMAÇÃO</text>

    <text x="0" y="145" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">Sandro</text>
    <text x="0" y="232" fill="#FFD400" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">Ferreira</text>

    <text x="2" y="287" fill="#EAF4F1" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400">Tecnologia aplicada a problemas reais de negócio.</text>

    <g transform="translate(2 326)">
      <rect x="0" y="0" width="320" height="3" rx="1.5" fill="url(#bar)"/>
      <text x="0" y="34" fill="#8FAAA3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="2">sandrozdb.com</text>
    </g>
  </g>

  <g transform="translate(1130 30)" opacity="0.98">
    <path d="M 80 20 H 310 Q 370 20 370 80 V 155" fill="none" stroke="#FFD400" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20 210 V 165 Q 20 95 90 95 H 205" fill="none" stroke="#0AC8AF" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 215 395 H 305 Q 370 395 370 330 V 220" fill="none" stroke="url(#loop)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="130" cy="320" r="78" fill="none" stroke="url(#loop)" stroke-width="46"/>
  </g>

  <g transform="translate(1260 185)">
    <rect x="0" y="0" width="130" height="82" rx="22" fill="#031E19" stroke="#16CDB6" stroke-width="2"/>
    <text x="65" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">SF</text>
  </g>

  <text x="1190" y="408" fill="#72968E" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">VISÃO DE NEGÓCIO • TECNOLOGIA • RESULTADOS</text>
</svg>
