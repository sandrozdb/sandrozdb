<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Sandro Ferreira</title>
  <desc id="desc">Consultoria, IA, dados e automação</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="0.55" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#15191f"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#d6a15a" stroke-width="1" opacity="0.07"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c987"/>
      <stop offset="0.52" stop-color="#d6a15a"/>
      <stop offset="1" stop-color="#b97825"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1450" cy="30" r="210" fill="#b97825" opacity="0.12" filter="url(#glow)"/>
  <circle cx="135" cy="405" r="190" fill="#d6a15a" opacity="0.04" filter="url(#glow)"/>

  <g transform="translate(84 58)">
    <rect x="0" y="0" width="58" height="6" rx="3" fill="#d6a15a"/>
    <text x="0" y="30" fill="#d6a15a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CONSULTORIA • IA • DADOS • AUTOMAÇÃO</text>

    <text x="0" y="118" fill="#f4efe8" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800">Sandro</text>
    <text x="0" y="210" fill="#d6a15a" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800">Ferreira</text>

    <text x="0" y="272" fill="#b8afa4" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500">Consultoria  •  IA  •  Dados  •  Automação</text>
    <text x="0" y="342" fill="#f4efe8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">Tecnologia com visão de negócio.</text>

    <g transform="translate(0 375)">
      <rect x="0" y="0" width="126" height="7" rx="3.5" fill="url(#accent)"/>
      <text x="0" y="48" fill="#b8afa4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="5">sandrozdb.com</text>
    </g>
  </g>

  <g transform="translate(1080 70)">
    <rect x="0" y="0" width="370" height="260" rx="36" fill="#0d1116" stroke="#d6a15a" stroke-width="2" opacity="0.94"/>
    <path d="M45 194 C112 112 171 220 315 104" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="45" cy="194" r="8" fill="#f2c987"/>
    <circle cx="177" cy="151" r="8" fill="#d6a15a"/>
    <circle cx="315" cy="104" r="8" fill="#b97825"/>
    <path d="M44 56H326" stroke="#d6a15a" opacity="0.17"/>
    <path d="M44 92H326" stroke="#d6a15a" opacity="0.10"/>
  </g>
</svg>
