<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Sandro Ferreira</title>
  <desc id="desc">Consultoria, IA, dados e automação</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041712"/>
      <stop offset="0.55" stop-color="#031d19"/>
      <stop offset="1" stop-color="#092218"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#18a890" stroke-width="1" opacity="0.10"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11d9c2"/>
      <stop offset="1" stop-color="#12c7e0"/>
    </linearGradient>
    <linearGradient id="shape1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd332"/>
      <stop offset="1" stop-color="#19dbc5"/>
    </linearGradient>
    <linearGradient id="shape2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6170ff"/>
      <stop offset="0.35" stop-color="#a14de5"/>
      <stop offset="0.7" stop-color="#ff8b4c"/>
      <stop offset="1" stop-color="#ff4f5e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="440" rx="28" fill="url(#grid)"/>

  <circle cx="95" cy="40" r="140" fill="#ffd332" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1530" cy="20" r="160" fill="#16dbc7" opacity="0.12" filter="url(#glow)"/>

  <g transform="translate(84 58)">
    <rect x="0" y="0" width="58" height="6" rx="3" fill="#ffd332"/>
    <text x="0" y="30" fill="#16dbc7" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CONSULTORIA • IA • DADOS • AUTOMAÇÃO</text>

    <text x="0" y="118" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800">Sandro</text>
    <text x="0" y="210" fill="url(#name)" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800">Ferreira</text>

    <text x="0" y="272" fill="#dbe7e3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500">Consultoria  <tspan fill="#ffd332">•</tspan>  IA  <tspan fill="#16dbc7">•</tspan>  Dados  <tspan fill="#ff5d6f">•</tspan>  Automação</text>
    <text x="0" y="342" fill="#f4f7f6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">Tecnologia com visão de negócio.</text>

    <g transform="translate(0 375)">
      <rect x="0" y="0" width="126" height="7" rx="3.5" fill="url(#shape1)"/>
      <text x="0" y="48" fill="#b8c9c3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="5">sandrozdb.com</text>
    </g>
  </g>

  <g transform="translate(1095 50)">
    <path d="M 45 40 H 365 Q 470 40 470 145 V 300" fill="none" stroke="url(#shape1)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(1095 218)">
    <path d="M 65 175 A 150 150 0 1 1 360 175 C 410 175 435 200 455 230" fill="none" stroke="url(#shape2)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
